name: KRX official API connection check (private data not published)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-krx-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check KRX authentication and ETF service approval (no market data retained)
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: node scripts/check-krx-connection.js
