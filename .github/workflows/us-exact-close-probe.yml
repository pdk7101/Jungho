name: US exact-date close probe (isolated)
on:
  push:
    branches: [architecture-v17]
    paths: ['.github/workflows/us-exact-close-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/architecture-v17'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Alpaca daily bars without publishing
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          node --input-type=module <<'JS'
          const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'});
          const valid=x=>typeof x==='number'&&Number.isFinite(x)&&x>0;
          if(!process.env.ALPACA_API_KEY||!process.env.ALPACA_SECRET_KEY)throw Error('Missing credentials');
          let sipCount=0;
          for(const feed of ['sip','iex']){
            let count=0;
            for(const symbol of ['SCHD','AGNC','SPYM','CONY','SPCX']){
              try{
                const url=new URL('https://data.alpaca.markets/v2/stocks/'+symbol+'/bars');
                for(const [k,v] of Object.entries({timeframe:'1Day',start:'2026-11-27T05:00:00Z',end:'2026-11-27T19:00:00Z',feed,adjustment:'raw',limit:'10'}))url.searchParams.set(k,v);
                const r=await fetch(url,{headers:{'APCA-API-KEY-ID':process.env.ALPACA_API_KEY,'APCA-API-SECRET-KEY':process.env.ALPACA_SECRET_KEY},signal:AbortSignal.timeout(15000),redirect:'error'});
                if(!r.ok){console.log(symbol,feed,'HTTP',r.status);continue;}
                const j=await r.json();
                const bars=(j.bars||[]).filter(b=>fmt.format(new Date(b.t))==='2026-11-27'&&[b.o,b.h,b.l,b.c].every(valid)&&b.h>=Math.max(b.o,b.c)&&b.l<=Math.min(b.o,b.c)&&b.h>=b.l);
                const ok=j.symbol===symbol&&bars.length===1&&!j.next_page_token;
                console.log(symbol,feed,'expected 2026-11-27',ok?'exact-date OHLC present':'missing or invalid');
                if(ok){count++;console.log(symbol,feed,'date',fmt.format(new Date(bars[0].t)),'close USD',bars[0].c);}
              }catch{console.log(symbol,feed,'request or schema failure');}
            }
            console.log(feed,'coverage',count+'/5');
            if(feed==='sip')sipCount=count;
          }
          if(sipCount!==5)process.exitCode=1;
          JS
