name: Free ISA ETF daily update and GitHub Pages deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/metric-history.json'
      - 'data/krx-history.json'
  workflow_dispatch:
  schedule:
    - cron: '25 08 * * 1-5'
    - cron: '15 09 * * 1-5'
    # KRX official completed daily bars are fetched on the existing 17:25 / 18:15 KST runs.
    # New York 16:00 close (both daylight saving and standard time): next day Korea morning.
    - cron: '35 22 * * 1-5'
    - cron: '15 23 * * 1-5'
    # Extra 09:30 KST refresh (Tue-Sat) after the prior US regular session has ended.
    # GitHub-hosted cron may run late; the dashboard must still label dated closes.
    - cron: '30 0 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify established investment rules (fail closed)
        run: node scripts/verify-investment-contract.js && node scripts/verify-payout-entry.js && node scripts/verify-krx-official.js && node scripts/verify-krx-private.js && node scripts/verify-ui-integrity.js && node scripts/verify-valuation-stability.js && node scripts/verify-toss-broker-reconciliation.js && node scripts/verify-toss-readonly.js && node scripts/verify-toss-offline.js
      # Public Pages must not redistribute KRX data.
      # Official credentials are checked separately in a manual diagnostic.
      - name: Keep licensed KRX price data out of public Pages
        run: node scripts/update-quotes.js
      - name: Flag unconnected official Korean intraday prices
        run: node scripts/update-intraday.js
      - name: Collect official KRX ETF market cap and NAV metrics
        run: node scripts/update-metrics.js
      - name: Collect US market completed daily bars and dividend/split events
        run: node scripts/update-us.js
      - name: Save official KRX daily history and verified metrics
        run: |
          if ! git diff --quiet -- data/metric-history.json data/krx-history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/metric-history.json data/krx-history.json
            git commit -m "data: refresh verified KRX ETF trading history"
            git push origin HEAD:main || echo "Warning: historic metric snapshot push failed; retry on next run"
          fi
      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html insights.js live-prices.js private-krx-client.js personal-us-live.js us-dashboard.js us-krw.js us-signals.js unattended-orders.js portfolio-import.js intraday-signals.js portfolio-totals.js personal-toss-client.js account-summary.js kr-dividends.js portfolio-sync.js quotes.json intraday-quotes.json metrics.json us-quotes.json site/
          cp data/metric-history.json site/metric-history.json
          node scripts/stamp-assets.js site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm Pages artifact indexed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 18); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name==\"$ARTIFACT_NAME\") | select(.expired==false)] | length" || echo 0)"
            if [ "$count" = "1" ]; then
              echo "Pages artifact ready: $ARTIFACT_NAME"
              sleep 10
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "Duplicate Pages artifacts for this attempt."
              exit 1
            fi
            sleep 5
          done
          echo "Pages artifact registration not yet visible in Actions API."
          exit 1
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
