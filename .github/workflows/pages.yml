name: Free ISA ETF daily update and GitHub Pages deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/metric-history.json'
  workflow_dispatch:
  schedule:
    - cron: '25 08 * * 1-5'
    - cron: '15 09 * * 1-5'
    # New York 16:00 close (both daylight saving and standard time): next day Korea morning.
    - cron: '35 22 * * 1-5'
    - cron: '15 23 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain latest published daily bars (unofficial)
        run: node scripts/update-quotes.js
      - name: Collect ETF market cap, NAV and trade metrics
        run: node scripts/update-metrics.js
      - name: Collect US market completed daily bars and dividend/split events
        run: node scripts/update-us.js
      - name: Save dated ETF metric snapshots to repository
        run: |
          if ! git diff --quiet -- data/metric-history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/metric-history.json
            git commit -m "data: capture ETF market-cap and NAV snapshot"
            git push origin HEAD:main || echo "Warning: historic metric snapshot push failed; retry on next run"
          fi
      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html insights.js live-prices.js us-dashboard.js us-krw.js us-signals.js quotes.json metrics.json us-quotes.json site/
          cp data/metric-history.json site/metric-history.json
          node scripts/stamp-assets.js site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
