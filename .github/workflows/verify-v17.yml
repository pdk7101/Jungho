name: V17 isolated development verification
on:
  push:
    branches: [architecture-v17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing v16 regression suite
        run: node scripts/verify-investment-contract.js && node scripts/verify-payout-entry.js && node scripts/verify-krx-official.js && node scripts/verify-krx-private.js && node scripts/verify-ui-integrity.js && node scripts/verify-valuation-stability.js && node scripts/verify-toss-broker-reconciliation.js && node scripts/verify-toss-readonly.js && node scripts/verify-toss-offline.js
      - name: V17 isolated registry and scheduled collection tests
        run: node scripts/verify-instrument-registry.mjs && node scripts/verify-us-freshness.mjs && node scripts/verify-us-collector-v17.mjs && node scripts/verify-us-scheduled-v17.mjs && node scripts/verify-legacy-registry-preview.mjs && node scripts/verify-registry-ui-preview.mjs && node scripts/verify-registry-cloud-client-v17.mjs
